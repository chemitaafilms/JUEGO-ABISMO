<script>
'use strict';
/* =====================================================================
   ABISMO — survivor-like en un solo archivo.
   ===================================================================== */
const TAU=Math.PI*2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));

/* ---------------- guardado ---------------- */
const SKEY='abismo_survivor_v1';
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.meta)return s;}catch(e){}return{gold:0,bestTime:0,bestKills:0,runs:0,mute:false,char:'mage',meta:{}};}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
let save=loadSave();
const META=[

/* ---------------- datos ---------------- */
const CHARS=[
 {id:'mage',name:'Arcanista',icon:'🧙',desc:'Empieza con Proyectil Arcano. Equilibrado.',w:'bolt',color:'#8ab4ff',hp:100,spd:1,armor:0},

const WEAPONS={
 bolt:{name:'Proyectil Arcano',icon:'🔮',T:{dmg:[10,12,12,16,16,22],n:[1,1,2,2,3,3],pierce:[0,1,1,2,2,3],cd:[.9,.85,.8,.75,.7,.55]},
  txt:['Dispara al enemigo más cercano.','Perfora 1 enemigo y más daño.','+1 proyectil.','Perfora 2 enemigos y más daño.','+1 proyectil.','Daño, perforación y cadencia al máximo.']},

 lightning:{name:'Cadena de Rayos',icon:'⚡',T:{n:[1,2,2,3,3,4],dmg:[28,32,40,40,48,56],cd:[1.7,1.6,1.5,1.4,1.2,1.0]},
  txt:['Un rayo cae sobre un enemigo.','+1 rayo.','Más daño.','+1 rayo.','Más daño y cadencia.','+1 rayo y daño máximo.']},
 axe:{name:'Hacha Giratoria',icon:'🪓',T:{n:[1,1,2,2,3,3],dmg:[20,26,26,32,32,40],cd:[1.5,1.4,1.4,1.3,1.2,1.1]},

};
const PASSIVES={
 vigor:{name:'Vigor',icon:'❤️',txt:'+20 vida máxima',max:5},
 might:{name:'Fuerza',icon:'💪',txt:'+12% daño',max:5},
 swift:{name:'Celeridad',icon:'👟',txt:'+8% velocidad',max:5},
 haste:{name:'Frenesí',icon:'⏱️',txt:'-8% enfriamiento',max:5},
 magnet:{name:'Imán',icon:'🧲',txt:'+30% radio de recogida',max:5},
 regen:{name:'Regeneración',icon:'🌿',txt:'+0.5 vida por segundo',max:5},
 armor:{name:'Coraza',icon:'🛡️',txt:'-1 al daño recibido',max:5},
 area:{name:'Expansión',icon:'⭕',txt:'+10% área de efecto',max:5},
};
const ET={
 bat:{r:9,hp:7,spd:100,dmg:5,xp:1,col:'#b57bff'},
 zombie:{r:12,hp:22,spd:52,dmg:8,xp:2,col:'#6fcf7f'},
 runner:{r:10,hp:12,spd:125,dmg:7,xp:2,col:'#ffb04a'},
 shooter:{r:12,hp:28,spd:58,dmg:9,xp:4,col:'#ff6a8a'},
 ghost:{r:13,hp:38,spd:78,dmg:11,xp:4,col:'#9fe8ff',ghost:true},
 brute:{r:21,hp:130,spd:40,dmg:15,xp:9,col:'#d9534f',mass:3},
 boss:{r:42,hp:1700,spd:46,dmg:22,xp:120,col:'#ff3b5c',mass:12},
};
const BOSSNAMES=['EL COLOSO','LA GUADAÑA','EL DEVORADOR'];
const PR=13, MAXE=420, WIN_T=600;
const xpNeed=l=>Math.floor(5+l*3.2+l*l*.32);
const hpScale=t=>1+(t/60)*.2+(t/60)*(t/60)*.01;
const fmtT=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};

/* ---------------- audio ---------------- */
let AC=null,master,sfxG,musG,noiseBuf;
const lastS={};
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=save.mute?0:1;
  const comp=AC.createDynamicsCompressor();comp.connect(master);master.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=.55;sfxG.connect(comp);
  musG=AC.createGain();musG.gain.value=.2;musG.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  mNext=AC.currentTime+.1;setInterval(musicTick,120);
 }catch(e){AC=null;}
}
function toneAt(t,f,dur,type,vol,dest,f2){
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.03);
}
function noiseAt(t,dur,vol,freq,type,dest){
 const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*.4);s.stop(t+dur+.03);
}
const tone=(f,dur,type,vol,f2,delay)=>toneAt(AC.currentTime+(delay||0),f,dur,type,vol,sfxG,f2);
const noise=(dur,vol,freq,type,delay)=>noiseAt(AC.currentTime+(delay||0),dur,vol,freq,type,sfxG);
const GAP={hit:.035,kill:.04,gem:.05,shoot:.07,zap:.1,coin:.05,hurt:.15,whoosh:.15};
function sfx(n){
 if(!AC||save.mute)return;const t=AC.currentTime;if(lastS[n]&&t-lastS[n]<(GAP[n]||.05))return;lastS[n]=t;
 switch(n){
  case'shoot':tone(620,.09,'triangle',.12,280);break;
  case'hit':noise(.05,.1,2200,'bandpass');break;
  case'kill':tone(210,.1,'square',.06,70);break;
  case'gem':tone(900+Math.random()*300,.07,'sine',.09,1500);break;
  case'coin':tone(1200,.06,'square',.06,1800);tone(1800,.1,'square',.05,null,.06);break;
  case'hurt':tone(140,.25,'sawtooth',.2,50);noise(.2,.18,600,'lowpass');break;
  case'zap':noise(.25,.25,3000,'highpass');tone(1400,.2,'sawtooth',.1,200);break;
  case'whoosh':noise(.18,.1,900,'bandpass');break;
  case'nova':tone(300,.5,'sine',.2,80);noise(.4,.12,5000,'highpass');break;
  case'level':[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,null,i*.07));break;
  case'heart':tone(520,.12,'sine',.15,880);tone(780,.2,'sine',.15,1100,.08);break;
  case'chest':[392,523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.08,null,i*.06));break;
  case'boss':tone(70,1.2,'sawtooth',.25,40);noise(.8,.2,200,'lowpass');break;
  case'boom':noise(.5,.3,300,'lowpass');tone(120,.4,'sine',.3,30);break;
  case'start':tone(220,.5,'sawtooth',.1,440);break;
  case'over':tone(330,.9,'sawtooth',.2,60);break;
  case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.15,null,i*.12));break;
 }
}
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mf=m=>440*Math.pow(2,(m-69)/12);
let mNext=0,mStep=0;
function musicTick(){
 if(!AC||AC.state!=='running')return;
 if(state==='pause'||state==='over'||state==='win'||save.mute){mNext=Math.max(mNext,AC.currentTime+.05);return;}
 while(mNext<AC.currentTime+.4){musicStep(mStep,mNext);mStep++;mNext+=.3125;}
}
function musicStep(s,t){
 const inten=(G&&state==='play')?Math.min(1,G.t/420):0;
 const ch=CH[Math.floor(s/16)%4],st=s%16;
 if(st===0)ch.forEach(n=>toneAt(t,mf(n),4.6,'sine',.07,musG));
 if(st%8===0)toneAt(t,mf(ch[0]-24),1.2,'sine',.5,musG);
 if(st%2===0)toneAt(t,mf(ch[[0,1,2,1][(st/2)%4]]+12),.35,'triangle',.1+.05*inten,musG);
 if(inten>.2&&st%4===0)toneAt(t,130,.18,'sine',.55,musG,45);
 if(inten>.5&&st%2===1)noiseAt(t,.04,.07,7000,'highpass',musG);
 if(inten>.7&&st%8===4)noiseAt(t,.12,.12,1800,'bandpass',musG);
}

/* ---------------- entrada ---------------- */
const input={keys:{},stick:null};
const KEYMAP={w:'u',arrowup:'u',s:'d',arrowdown:'d',a:'l',arrowleft:'l',d:'r',arrowright:'r'};
window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(KEYMAP[k]){input.keys[KEYMAP[k]]=true;if(state==='play')e.preventDefault();}
 if(k===' '&&state==='play')e.preventDefault();
 if(e.repeat)return;
 if(k==='escape'||k==='p'){if(state==='play')openPause();else if(state==='pause')resumeGame();}
 else if(k==='m')toggleMute();
 else if(state==='levelup'){if(k==='1'||k==='2'||k==='3')choose(parseInt(k)-1);else if(k==='r')reroll();}
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k)input.keys[k]=false;});
window.addEventListener('blur',()=>{input.keys={};input.stick=null;if(state==='play')openPause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openPause();});
cv.addEventListener('pointerdown',e=>{
 initAudio();if(state!=='play')return;
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 input.stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{const s=input.stick;if(s&&s.id===e.pointerId){s.x=e.clientX;s.y=e.clientY;}});
const endPtr=e=>{if(input.stick&&input.stick.id===e.pointerId)input.stick=null;};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function moveVec(){
 let x=0,y=0;const k=input.keys;
 if(k.l)x-=1;if(k.r)x+=1;if(k.u)y-=1;if(k.d)y+=1;
 if(x||y){const l=Math.hypot(x,y);return[x/l,y/l];}
 const s=input.stick;
 if(s){let dx=s.x-s.ox,dy=s.y-s.oy;const l=Math.hypot(dx,dy),R=60;
  if(l>R*1.5){s.ox+=dx/l*(l-R*1.5);s.oy+=dy/l*(l-R*1.5);dx=s.x-s.ox;dy=s.y-s.oy;}
  const l2=Math.hypot(dx,dy);if(l2>6){const m=Math.min(1,l2/R);return[dx/l2*m,dy/l2*m];}
 }
 return[0,0];
}

/* ---------------- estado ---------------- */
let state='menu',G=null,menuT=0;
let novaId=0,qstamp=0;
const menuEmbers=[];for(let i=0;i<70;i++)menuEmbers.push({x:Math.random(),y:Math.random(),s:rnd(.5,2.2),v:rnd(.01,.05)});

function newRun(){
 const ch=CHARS.find(c=>c.id===save.char)||CHARS[0];
 G={t:0,kills:0,gold:0,lvl:1,xp:0,need:xpNeed(1),
  p:{x:0,y:0,vx:0,vy:0,face:1,hp:100,iframes:0,flash:0,ch,weapons:[],pas:{},st:{},anim:0,revived:false},
  E:[],gems:[],pick:[],pb:[],eb:[],parts:[],fl:[],fx:[],queue:[],choices:[],cur:null,
  cam:{x:0,y:0},shake:0,spawnAcc:0,eliteT:45,swarmT:70,bossT:180,bossIdx:0,boss:null,rerolls:2,banner:null,hurtFlash:0,won:false,endless:false};
 addWeapon(ch.w);recalc();G.p.hp=G.p.st.maxHp;
}
function recalc(){
 const p=G.p,ch=p.ch,pa=p.pas,s=p.st;
 s.maxHp=Math.round((ch.hp+20*(pa.vigor||0))*(1+.1*mlv('hp')));
 s.dmg=(1+.12*(pa.might||0))*(1+.08*mlv('dmg'));
 s.spd=190*ch.spd*(1+.08*(pa.swift||0))*(1+.05*mlv('spd'));
 s.cd=Math.max(.4,1-.08*(pa.haste||0));
 s.mag=70*(1+.3*(pa.magnet||0))*(1+.2*mlv('mag'));
 s.regen=.5*(pa.regen||0);
 s.armor=(ch.armor||0)+(pa.armor||0)+mlv('arm');
 s.area=1+.1*(pa.area||0);
 s.xp=1+.1*mlv('xp');
}
function addWeapon(id){G.p.weapons.push({id,lv:1,t:.3,ang:0,pos:[],R:0});}
const wget=(w,k)=>WEAPONS[w.id].T[k][w.lv-1];

/* ---------------- rejilla espacial ---------------- */
const GB=4096,GC=56,gHead=new Int32Array(GB);let gNext=new Int32Array(1024);
const gh=(cx,cy)=>((cx*73856093)^(cy*19349663))&(GB-1);
function gridBuild(){
 gHead.fill(-1);const E=G.E;if(gNext.length<E.length)gNext=new Int32Array(E.length*2);
 for(let i=0;i<E.length;i++){const e=E[i];if(e.dead)continue;const h=gh(Math.floor(e.x/GC),Math.floor(e.y/GC));gNext[i]=gHead[h];gHead[h]=i;}
}
const QA=[];
function nearby(x,y,r){
 QA.length=0;qstamp++;const E=G.E,R=r+30;
 const c0=Math.floor((x-R)/GC),c1=Math.floor((x+R)/GC),r0=Math.floor((y-R)/GC),r1=Math.floor((y+R)/GC);
 for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
  for(let i=gHead[gh(cx,cy)];i!==-1;i=gNext[i]){
   const e=E[i];if(e.dead||e.qs===qstamp)continue;
   const dx=e.x-x,dy=e.y-y,rr=r+e.r;
   if(dx*dx+dy*dy<=rr*rr){e.qs=qstamp;QA.push(e);}
  }
 }
 return QA;
}

function updateEnemies(dt){
 const p=G.p,E=G.E,maxD=Math.hypot(W,H)*.75+160;
 for(let i=0;i<E.length;i++){
  const e=E[i];if(e.dead)continue;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
  const sp=e.spd*(e.slowT>0?.5:1);let mx=nx*sp,my=ny*sp;

  if(e.type==='shooter'){
   if(d<230){mx=-nx*sp*.6;my=-ny*sp*.6;}else if(d<300){mx=-ny*sp*.7;my=nx*sp*.7;}
   e.sh-=dt;if(e.sh<=0&&d<430){e.sh=2.4;fireEB(e.x,e.y,Math.atan2(dy,dx),170,e.dmg);}
  }else if(e.boss){
   e.sh-=dt;
   if(e.sh<=0){e.sh=3.2;const n=14+e.idx*4,o=rnd(TAU);for(let k=0;k<n;k++)fireEB(e.x,e.y,o+k/n*TAU,150,e.dmg*.7,7);}
   if(e.dashT>0){e.dashT-=dt;mx=e.dx*360;my=e.dy*360;}
   else{e.dashCd-=dt;if(e.dashCd<=0){e.dashT=.9;e.dashCd=7;e.dx=nx;e.dy=ny;sfx('whoosh');}}
  }
  e.x+=(mx+e.kx)*dt;e.y+=(my+e.ky)*dt;

  if(e.flash>0)e.flash-=dt;if(e.slowT>0)e.slowT-=dt;
  if(!e.ghost){
   const list=nearby(e.x,e.y,e.r*.9);
   for(let k=0;k<list.length;k++){

    const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy)||.01,ov=e.r+o.r-od;
    if(ov>0){const f=ov*.5*(o.mass/(e.mass+o.mass));e.x+=ox/od*f;e.y+=oy/od*f;}
   }
  }
  if(d<e.r+PR)hurtPlayer(e.dmg);
  if(d>maxD&&!e.boss&&!e.elite){const q=ringPos();e.x=q[0];e.y=q[1];}
 }
 for(const b of G.eb){

 }
}

/* ---------------- armas ---------------- */
function nearestEnemies(x,y,range,n){
 const out=[],ds=[],r2=range*range;
 for(const e of G.E){
  if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d>r2)continue;
  let k=out.length;if(k<n){out.push(e);ds.push(d);}else if(d<ds[n-1]){out[n-1]=e;ds[n-1]=d;k=n-1;}else continue;
  while(k>0&&ds[k]<ds[k-1]){[ds[k],ds[k-1]]=[ds[k-1],ds[k]];[out[k],out[k-1]]=[out[k-1],out[k]];k--;}
 }
 return out;
}
function randomVisible(n){
 const p=G.p,c=[];
 for(const e of G.E){if(!e.dead&&Math.abs(e.x-p.x)<W/2&&Math.abs(e.y-p.y)<H/2){c.push(e);if(c.length>=80)break;}}

}

function buildChoices(){
 const p=G.p,pool=[];
 for(const w of p.weapons)if(w.lv<6)pool.push({kind:'w',id:w.id,lv:w.lv+1});
 if(p.weapons.length<6)for(const id in WEAPONS)if(!p.weapons.find(w=>w.id===id))pool.push({kind:'w',id,lv:1});
 const pk=Object.keys(p.pas).length;
 for(const id in PASSIVES){const l=p.pas[id]||0;if(l>=5)continue;if(l===0&&pk>=6)continue;pool.push({kind:'p',id,lv:l+1});}
 for(let i=pool.length-1;i>0;i--){const j=rint(0,i);[pool[i],pool[j]]=[pool[j],pool[i]];}
 const out=pool.slice(0,3);
 const fill=[{kind:'heal'},{kind:'gold'}];while(out.length<3)out.push(fill[out.length%2]);
 return out;
}
function openNext(){
 if(!G.queue.length){state='play';hideOv();return;}

 if(c.kind==='w'){const ex=p.weapons.find(w=>w.id===c.id);if(ex)ex.lv=c.lv;else addWeapon(c.id);}
 else if(c.kind==='p'){const old=p.st.maxHp;p.pas[c.id]=c.lv;recalc();p.hp=Math.min(p.st.maxHp,p.hp+p.st.maxHp-old);}
 else if(c.kind==='heal')p.hp=Math.min(p.st.maxHp,p.hp+p.st.maxHp*.4);
 else if(c.kind==='gold')G.gold+=60;
}

function update(dt){
 const p=G.p;G.t+=dt;
 const mv=moveVec(),tx=mv[0]*p.st.spd,ty=mv[1]*p.st.spd,sm=1-Math.exp(-14*dt);
 p.vx+=(tx-p.vx)*sm;p.vy+=(ty-p.vy)*sm;p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(Math.abs(mv[0])>.1)p.face=mv[0]>0?1:-1;
 if(mv[0]||mv[1])p.anim+=dt*12;else p.anim+=dt*3;

  ctx.font=`bold ${9*u}px 'Trebuchet MS',sans-serif`;ctx.fillStyle='#ffd45a';ctx.fillText(p.pas[id],x+20*u,y+15*u);x+=27*u;}
 // jefe
 if(G.boss&&!G.boss.dead){const bw=Math.min(520,W*.6),bx=(W-bw)/2,by=62*u;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,14*u);ctx.fillStyle='#ff3b5c';ctx.fillRect(bx,by,bw*Math.max(0,G.boss.hp/G.boss.mhp),14*u);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.strokeRect(bx,by,bw,14*u);
  ctx.fillStyle='#fff';ctx.font=`bold ${12*u}px 'Trebuchet MS',sans-serif`;ctx.fillText(G.boss.name,W/2,by+7*u+1);}
 // aviso
 if(G.banner){const b=G.banner,a=Math.min(1,b.t*2,(b.max-b.t)*4);ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.font=`900 ${44*u}px 'Trebuchet MS',sans-serif`;ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(b.txt,W/2,H*.3);ctx.fillStyle='#fff';ctx.fillText(b.txt,W/2,H*.3);
  if(b.sub){ctx.font=`${16*u}px 'Trebuchet MS',sans-serif`;ctx.fillStyle='#d8c8ff';ctx.fillText(b.sub,W/2,H*.3+34*u);}ctx.globalAlpha=1;}
 // joystick
 const s=input.stick;if(s&&state==='play'){const v=moveVec();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.ox,s.oy,60,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(s.ox+v[0]*60,s.oy+v[1]*60,24,0,TAU);ctx.fill();}
}
function drawMenuBg(){
 const t=menuT;drawGround(t*26,t*9,.25);
 ctx.globalCompositeOperation='lighter';
 for(const e of menuEmbers){e.y-=e.v*.016;if(e.y<-.05){e.y=1.05;e.x=Math.random();}
  ctx.fillStyle='rgba(190,140,255,.55)';ctx.beginPath();ctx.arc(e.x*W+Math.sin(t+e.x*9)*14,e.y*H,e.s,0,TAU);ctx.fill();}
 ctx.globalCompositeOperation='source-over';
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(!G){drawMenuBg();drawVignette();return;}
 drawWorld();drawVignette();drawHUD();
}

/* ---------------- interfaz (DOM) ---------------- */
function showOv(h){ov.innerHTML=h;ov.className='show';ov.scrollTop=0;}
function hideOv(){ov.className='';ov.innerHTML='';}
function showMenu(){
 state='menu';G=null;input.stick=null;
 showOv(`<div class="panel"><h1>ABISMO</h1><p class="sub">Sobrevive a la noche eterna</p>
 <div class="chars">${CHARS.map(c=>`<button class="char ${c.id===save.char?'sel':''}" data-act="char" data-id="${c.id}"><span class="ic">${c.icon}</span><b>${c.name}</b><p>${c.desc}</p></button>`).join('')}</div>
 <div class="row"><button class="btn primary" data-act="play">JUGAR</button></div>
 <div class="row"><button class="btn" data-act="shop">🪙 ${save.gold} · Mejoras</button><button class="btn" data-act="mute">${save.mute?'🔇 Sonido apagado':'🔊 Sonido'}</button></div>
 <p class="rec">Récord: ${fmtT(save.bestTime)} · Bajas: ${save.bestKills} · Partidas: ${save.runs}</p>
 <p class="hint">WASD / flechas para moverte · en móvil arrastra el dedo · Esc pausa · M silencia<br>Las armas atacan solas. Sobrevive hasta las 10:00.</p></div>`);
}
function showShop(){
 showOv(`<div class="panel"><h2>Mejoras permanentes</h2><div class="gold">🪙 ${save.gold}</div>
 <div class="shop">${META.map(m=>{const l=mlv(m.id),maxed=l>=m.max,c=maxed?0:m.cost(l);
  return`<div class="item"><span class="ic">${m.icon}</span><div class="tx"><b>${m.name}</b><small>${m.desc}</small><div class="pips">${Array.from({length:m.max},(_,i)=>`<span class="pip ${i<l?'on':''}"></span>`).join('')}</div></div>
  <button class="buy" data-act="buy" data-id="${m.id}" ${maxed||save.gold<c?'disabled':''}>${maxed?'MÁX':'🪙 '+c}</button></div>`;}).join('')}</div>
 <div class="row"><button class="btn" data-act="menu">Volver</button></div>
 <button class="link" data-act="reset">Borrar todo el progreso</button></div>`);
}
function showLevel(){
 const q=G.cur,title=q.kind==='chest'?'🎁 ¡Cofre!':'¡Nivel '+G.lvl+'!';
 const cards=G.choices.map((c,i)=>{
  let ic,nm,badge,ds,cls='';
  if(c.kind==='w'){const w=WEAPONS[c.id];ic=w.icon;nm=w.name;badge=c.lv===1?'NUEVA ARMA':'NIVEL '+c.lv;ds=w.txt[c.lv-1];if(c.lv===1)cls='new';}
  else if(c.kind==='p'){const w=PASSIVES[c.id];ic=w.icon;nm=w.name;badge='NIVEL '+c.lv;ds=w.txt;}
  else if(c.kind==='heal'){ic='🍖';nm='Banquete';badge='';ds='Restaura el 40% de tu vida.';}
  else{ic='💰';nm='Bolsa de oro';badge='';ds='+60 monedas al terminar.';}
  return`<button class="card ${cls}" data-act="pick" data-i="${i}"><span class="k">${i+1}</span><span class="ic">${ic}</span><b>${nm}</b><i>${badge}</i><p>${ds}</p></button>`;}).join('');
 showOv(`<div class="panel"><h2>${title}</h2><div class="cards">${cards}</div>
 <div class="row"><button class="btn" data-act="reroll" ${G.rerolls<=0?'disabled style="opacity:.4"':''}>🎲 Relanzar (${G.rerolls})</button></div></div>`);
}
function buildChips(){
 const p=G.p;
 return`<div class="build">${p.weapons.map(w=>`<span class="chip">${WEAPONS[w.id].icon} ${WEAPONS[w.id].name} · ${w.lv>=6?'MAX':'Nv'+w.lv}</span>`).join('')}${Object.keys(p.pas).map(id=>`<span class="chip">${PASSIVES[id].icon} ${PASSIVES[id].name} ${p.pas[id]}</span>`).join('')}</div>`;
}
function showOver(){
 showOv(`<div class="panel dead"><h2>HAS CAÍDO</h2>${statsHTML()}${buildChips()}
 <div class="row"><button class="btn primary" data-act="play">Reintentar</button><button class="btn" data-act="menu">Menú</button></div></div>`);
}
function statsHTML(){
 return`<div class="stats"><span>Tiempo</span><span>${fmtT(G.t)}</span><span>Nivel</span><span>${G.lvl}</span><span>Bajas</span><span>${G.kills}</span><span>Oro ganado</span><span>🪙 ${G.earned!==undefined?G.earned:G.gold}</span></div>`;
}
function showWin(){
 showOv(`<div class="panel win"><h1 style="font-size:clamp(36px,8vw,64px)">¡SOBREVIVISTE!</h1><p class="sub">Has resistido la noche eterna</p>${statsHTML()}
 <div class="row"><button class="btn primary" data-act="continue">Seguir en modo infinito</button><button class="btn" data-act="finish">Terminar y cobrar</button></div></div>`);
}
function openPause(){
 if(state!=='play')return;state='pause';input.stick=null;
 showOv(`<div class="panel"><h2>Pausa</h2><div class="stats"><span>Tiempo</span><span>${fmtT(G.t)}</span><span>Nivel</span><span>${G.lvl}</span><span>Bajas</span><span>${G.kills}</span></div>${buildChips()}
 <div class="row"><button class="btn primary" data-act="resume">Continuar</button><button class="btn" data-act="mute">${save.mute?'🔇':'🔊'} Sonido</button><button class="btn" data-act="quit">Abandonar</button></div></div>`);
}
function resumeGame(){if(state!=='pause')return;state='play';hideOv();}
function toggleMute(){
 save.mute=!save.mute;persist();if(master)master.gain.value=save.mute?0:1;
 if(state==='menu'){const s=ov.scrollTop;if(ov.querySelector('.chars'))showMenu();ov.scrollTop=s;}
 else if(state==='pause')openPauseRefresh();
}
function openPauseRefresh(){state='play';openPause();}
function startRun(){newRun();state='play';hideOv();banner('ABISMO','Sobrevive hasta las 10:00',3.2);sfx('start');}
ov.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;initAudio();
 const d=b.dataset;
 switch(d.act){
  case'play':startRun();break;
  case'char':save.char=d.id;persist();showMenu();break;
  case'shop':showShop();break;
  case'menu':showMenu();break;
  case'mute':toggleMute();break;
  case'buy':{const m=META.find(x=>x.id===d.id),l=mlv(m.id);if(l>=m.max)break;const c=m.cost(l);if(save.gold<c)break;save.gold-=c;save.meta[m.id]=l+1;persist();sfx('coin');showShop();break;}
  case'reset':if(confirm('¿Borrar todo el progreso?')){save={gold:0,bestTime:0,bestKills:0,runs:0,mute:save.mute,char:'mage',meta:{}};persist();showShop();}break;
  case'pick':choose(parseInt(d.i));break;
  case'reroll':reroll();break;
  case'resume':resumeGame();break;
  case'quit':G.over=true;showMenu();break;
  case'continue':G.endless=true;state='play';hideOv();banner('MODO INFINITO','Resiste todo lo que puedas',2.5);break;
  case'finish':endRun(true);break;
 }
});

/* ---------------- bucle principal ---------------- */
let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
 if(state==='play')update(dt);else menuT+=dt;
 render();
}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
